name: Verify raw bits
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Pack, verify and boot handwritten bytes
        run: make test
      - name: Website and documentation checks
        run: make site-test
      - name: Install browser test tools
        run: npm ci && npx playwright install --with-deps chromium firefox webkit
      - name: Real browser interactions and mobile layouts
        run: npm run test:browser
      - name: Firefox and WebKit routes, interactions and downloads
        run: npm run test:cross-browser
      - name: Boot the exact curated browser export in QEMU
        run: python3 tools/verify_browser_export.py
      - name: Clean source, deterministic artifacts
        run: |
          git diff --exit-code
          python3 -c 'import json; from tools.bitborn import ROOT,artifact_paths,digest; print(json.dumps({str(p):digest((ROOT/"build"/p).read_bytes()) for p in artifact_paths()},sort_keys=True))' > /tmp/first-build
          make build
          python3 -c 'import json; from tools.bitborn import ROOT,artifact_paths,digest; print(json.dumps({str(p):digest((ROOT/"build"/p).read_bytes()) for p in artifact_paths()},sort_keys=True))' > /tmp/second-build
          diff /tmp/first-build /tmp/second-build
      - uses: actions/upload-artifact@v4
        with:
          name: bitborn-images
          path: build/
